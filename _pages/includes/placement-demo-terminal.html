<span class="anchor" id="placement-terminal"></span>
<section class="placement-widget placement-widget--terminal" data-placement-widget="terminal" aria-labelledby="placement-terminal-title">
  <header class="placement-widget__header">
    <span class="placement-widget__number" aria-hidden="true">01</span>
    <div class="placement-widget__heading">
      <p class="placement-widget__eyebrow">AFTER PORTFOLIO · INTERACTIVE PROOF</p>
      <h2 id="placement-terminal-title">Demo Terminal</h2>
      <p>Visitors move from reading project cards to testing one compact research workflow.</p>
    </div>
    <span class="placement-widget__fit">Portfolio → proof</span>
  </header>

  <div class="placement-terminal" aria-label="Interactive project terminal">
    <div class="placement-terminal__bar" aria-hidden="true">
      <span></span><span></span><span></span>
      <em>chenxi@lab / demos</em>
      <b>LIVE SANDBOX</b>
    </div>
    <div class="placement-terminal__body">
      <p class="placement-terminal__command"><i aria-hidden="true">$</i> <code data-placement-terminal-command>agent inspect --scene lab.mp4</code></p>
      <pre data-placement-terminal-output aria-live="polite">ready — choose a command below.</pre>
      <span class="placement-terminal__cursor" aria-hidden="true"></span>
    </div>
    <div class="placement-terminal__commands" role="group" aria-label="Demo commands">
      <button class="is-active" type="button" data-placement-command="inspect" aria-pressed="true"><span>01</span> Inspect scene</button>
      <button type="button" data-placement-command="plan" aria-pressed="false"><span>02</span> Plan action</button>
      <button type="button" data-placement-command="explain" aria-pressed="false"><span>03</span> Explain failure</button>
    </div>
  </div>
</section>
