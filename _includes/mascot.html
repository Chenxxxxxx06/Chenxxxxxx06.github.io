<aside class="mascot-widget" id="mascotWidget" aria-label="Chen Xi's current status">
  <div class="mascot-bubble" id="mascotBubble" role="status" aria-live="polite"></div>
  <section class="mascot-contact" id="mascotContact" aria-hidden="true" aria-label="Contact Chen Xi">
    <button class="mascot-contact__close" id="mascotContactClose" type="button" aria-label="Close email card">×</button>
    <a class="mascot-contact__send" id="mascotEmailSend" href="mailto:{{ site.author.email }}?subject=Hi%20Chen%20Xi%2C%20let%27s%20chat" target="_self">Let’s talk</a>
  </section>
  <button class="mascot-button" id="mascotButton" type="button" aria-label="Talk to Chen Xi">
    <img
      class="mascot-image"
      id="mascotImage"
      src="{{ '/assets/images/mascot/mascot-working.webp' | relative_url }}"
      data-base-url="{{ '/assets/images/mascot/' | relative_url }}"
      alt="Chen Xi is working"
      width="640"
      height="640"
    >
    <span class="mascot-status" id="mascotStatus" title="Automatically follows Beijing time">WORKING</span>
  </button>
</aside>
