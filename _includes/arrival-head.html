<script>
(function () {
  try {
    var theme = localStorage.getItem('site-theme');
    if (['yellow', 'blue', 'dark'].indexOf(theme) !== -1) document.documentElement.setAttribute('data-theme', theme);
    var replay = new URLSearchParams(location.search).get('intro') === 'replay';
    var navigation = performance.getEntriesByType('navigation')[0];
    if (location.hash || (navigation && navigation.type === 'back_forward') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!replay && sessionStorage.getItem('chen-arrival-v2') === '1') return;
    document.documentElement.setAttribute('data-arrival', 'pending');
    window.setTimeout(function () {
      if (document.documentElement.getAttribute('data-arrival') === 'pending') {
        document.documentElement.removeAttribute('data-arrival');
        window.chenArrivalExpired = true;
      }
    }, 5000);
  } catch (_) {}
})();
</script>
